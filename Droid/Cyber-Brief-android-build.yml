name: Android Build

on:
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PAYMENTS_CLIENT_TOKEN: ${{ secrets.VITE_PAYMENTS_CLIENT_TOKEN }}

      - name: Add Android platform (first run only — no-ops if already present)
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      # This produces a debug APK — installable on a test device/emulator
      # for sideloading, but NOT submittable to Google Play. Play requires
      # a signed release build (AAB format, not APK) using your own
      # upload keystore. Ask for that step once you've created a Google
      # Play Console account ($25 one-time) and generated a keystore —
      # the keystore must be added as a base64-encoded repo secret and
      # never committed to the repo directly.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
